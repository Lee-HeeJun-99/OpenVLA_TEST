/dsr01/automatic_cube_dataset_recorder:
  ros__parameters:
    image_topic: /zed/zed_node/rgb/color/rect/image
    dataset_root: raw_dataset
    episode_id: auto
    instruction: pick up the cube
    task: cube_pick

    record_frequency_hz: 10.0
    max_image_age_sec: 0.10
    jpeg_quality: 95
    seed: 2026

    robot_id: dsr01
    robot_model: a0509

    x_min_mm: 428.25
    x_max_mm: 627.16
    y_min_mm: -218.94
    y_max_mm: 305.11
    start_z_mm: 400.0

    # Too-near starts make the episode shorter than intended.
    min_start_xy_distance_mm: 120.0
    max_sampling_attempts: 100

    # [x_mm, y_mm, z_mm, rx_deg, ry_deg, rz_deg]
    grasp_pose_mm_deg:
      [539.72, 31.99, 224.85, 46.59, 178.82, -131.11]

    alignment_z_mm: 320.0
    lift_z_mm: 350.0

    # Approximate recorded duration:
    # 2.8 + 1.0 + 1.0(gripper) + 1.2 + short holds ~= 6.3 sec
    alignment_duration_sec: 2.8
    descent_duration_sec: 1.0
    lift_duration_sec: 1.2

    minimum_velocity_mm_s: 30.0
    maximum_velocity_mm_s: 150.0
    move_acceleration_mm_s2: 200.0

    initial_hold_sec: 0.10
    alignment_hold_sec: 0.05
    grasp_hold_sec: 0.05
    final_hold_sec: 0.20

    initial_gripper_state: 1
    gripper_open_output_index: 1
    gripper_close_output_index: 2
    gripper_pulse_time_sec: 1.0
