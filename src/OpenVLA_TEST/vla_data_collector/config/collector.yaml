/dsr01/waypoint_recorder:
  ros__parameters:
    output_path: waypoints/cube_pick.json
    instruction: pick up the cube
    task: cube_pick

    robot_id: dsr01
    robot_model: a0509

    pose_decimals: 6

    # true면 기존 output_path 파일을 불러와 수정합니다.
    load_existing: false

/dsr01/dataset_recorder:
  ros__parameters:
    image_topic: /zed/zed_node/rgb/color/rect/image
    waypoint_path: waypoints/cube_pick.json
    dataset_root: raw_dataset
    episode_id: episode_000001
    record_frequency_hz: 10.0

    robot_id: dsr01
    robot_model: a0509

    gripper_open_output_index: 1
    gripper_close_output_index: 2
    gripper_pulse_time_sec: 1.0

    move_velocity_mm_s: 30.0
    move_angular_velocity_deg_s: 20.0
    move_acceleration_mm_s2: 60.0
    move_angular_acceleration_deg_s2: 40.0
    waypoint_pause_sec: 0.2
    jpeg_quality: 95
